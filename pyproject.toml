[project]
name = "warrant"
version = "0.0.1"
description = "A remote MCP server that acts as an OAuth resource server: JWT verification against the issuer's JWKS, per-tool scopes, and per-user data."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff~=0.15.0",  # minor pinned: new releases add default rules
]

[project.scripts]
warrant = "warrant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
